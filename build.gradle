plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.3.27'
}

version = '3.0'
group = 'com.fpickup'

base {
    archivesName = 'fpickup-1.12.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mcVersion = '1.12.2'
    username = 'Developer'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    mavenCentral()
}
